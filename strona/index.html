<!DOCTYPE html>
<html lang="pl">
<head>
  <meta name="google-site-verification" ...
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.E.K.M. — Wybierz język / Select language</title>
  <meta name="description" content="T.E.K.M. — Towarzysze Ejaje Kombinat Myśli. Independent creative collective.">
  <meta name="robots" content="index, follow">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .lang-logo {
      max-width: 400px;
      width: 100%;
      margin-bottom: 2rem;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .lang-title {
      font-size: 1.5rem;
      font-weight: 300;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }
    .lang-subtitle {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
      text-align: center;
    }
    .lang-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .lang-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.3s ease;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      background: #1a1a1a;
      color: #e8e8e8;
      border-color: #3f3f46;
    }
    .lang-btn:hover {
      border-color: #dc2626;
      color: #fff;
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.3);
      transform: translateY(-2px);
    }
    .lang-btn .flag {
      font-size: 1.25rem;
    }
    footer {
      margin-top: 3rem;
      color: #4b5563;
      font-size: 0.75rem;
      font-family: 'Courier New', monospace;
    }
  </style>

  <!-- Auto-redirect based on browser language -->
  <script>
    (function() {
      var lang = navigator.language || navigator.userLanguage;
      if (lang && lang.toLowerCase().startsWith('pl')) {
        window.location.replace('pl/');
      }
    })();
  </script>
</head>
<body>
  <img src="images/tekm-logo.jpg" alt="T.E.K.M. Logo" class="lang-logo">
  <h1 class="lang-title">T.E.K.M.</h1>
  <p class="lang-subtitle">Towarzysze Ejaje Kombinat Myśli<br>Independent creative collective</p>

  <div class="lang-buttons">
    <a href="pl/" class="lang-btn">
      <span class="flag">🇵🇱</span>
      Polski
    </a>
    <a href="en/" class="lang-btn">
      <span class="flag">🇬🇧</span>
      English
    </a>
  </div>

  <footer>© 2026 T.E.K.M.</footer>
</body>
</html>
